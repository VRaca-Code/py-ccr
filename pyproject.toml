[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ccr"
version = "0.1.0"
description = "Multi-Asset Counterparty Credit Risk and XVA Engine"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
