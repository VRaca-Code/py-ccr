[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
readme = "README.md"
name = "py-ccr"
version = "0.1.0"
description = "Multi-Asset Counterparty Credit Risk and XVA Engine"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14"
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "seaborn>=0.13"]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "httpx>=0.27", "mypy>=1.20,<2"]

dashboard = ["streamlit>=1.35", "plotly>=5.22"]
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src/pyccr/xva", "src/pyccr/stress"]
follow_imports = "normal"
show_error_codes = true

[project.urls]
Repository = "https://github.com/VRaca-Code/py-ccr"
